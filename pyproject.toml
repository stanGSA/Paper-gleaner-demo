[project]
name = "paper-gleaner"
dynamic = ["version"]
description = "Fork 即用、零服务器的论文追踪 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "openai>=1.40,<2",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
    "typer>=0.12",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pymupdf>=2.0",
    "selectolax>=1.0.2",
]

[project.scripts]
gleaner = "gleaner.cli:app"
gleaner-mcp = "gleaner.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]

[dependency-groups]
dev = [
    "mcp>=2.3",
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gleaner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gleaner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
